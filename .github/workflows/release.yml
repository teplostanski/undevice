name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@latest

      - name: Resolve release metadata
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Git tag must match package.json version v${version}`);
          }

          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version);
          if (!match) throw new Error(`Invalid version: ${version}`);

          const prerelease = match[4];
          const distTag = prerelease ? prerelease.split('.')[0] : 'latest';
          if (prerelease && (!/^[a-z][a-z0-9-]*$/.test(distTag) || distTag === 'latest')) {
            throw new Error(`Use a named prerelease channel such as beta or rc: ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT,
            `dist-tag=${distTag}\nprerelease=${Boolean(prerelease)}\n`);
          console.log(`Version: ${version}; npm tag: ${distTag}; prerelease: ${Boolean(prerelease)}`);
          NODE

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm smoke

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
