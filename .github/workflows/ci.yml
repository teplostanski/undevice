name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node:
          - 22
          - 24

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install

      - run: pnpm check:lib

      - name: Build documentation
        if: matrix.node == 24
        run: pnpm docs:build && pnpm docs:smoke

      - name: Validate coverage badge
        if: matrix.node == 24 && github.event_name == 'pull_request'
        run: pnpm badge:coverage --dry-run

  update-badge:
    name: Update coverage badge
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm badge:coverage

      - name: Commit updated badge
        env:
          HUSKY: "0"
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main has advanced; a newer CI run will update the badge.'
            exit 0
          fi

          git add -- .github/badges/coverage.svg
          if git diff --cached --quiet; then
            echo 'Coverage badge is unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update coverage badge'
          git push origin HEAD:main
